name: One-shot anchored scan v8 finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-anchored-scan-v8.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump anchored analytics schema and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          for name,old,new in [
            ('supabase/functions/ms-parcel-api/analytics.ts','schemaVersion:7','schemaVersion:8'),
            ('supabase/functions/ms-parcel-api/index.ts','schemaVersion===7','schemaVersion===8'),
            ('analytics-client.js','schemaVersion===7','schemaVersion===8'),
            ('tests-ui.mjs','schemaVersion:7','schemaVersion:8'),
          ]:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'{old} missing in {name}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          oldver='20260906-manager-lossless-v1'
          newver='20260906-anchored-scan-v1'
          for name in ['index.html','app.js','ops.js','analytics-client.js','snapshot-client.js']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if oldver in s: p.write_text(s.replace(oldver,newver),encoding='utf-8')
          PY
      - name: Validate frontend and data model
        run: |
          node --check app.js
          node --check inspector.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check ops.js
          node --check shell.js
          node --check data-model.js
          node --check auth-client.js
          node tests-data.mjs
      - name: Validate all six workspace views
        run: |
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge
        run: deno check supabase/functions/ms-parcel-api/index.ts
      - name: Commit validated anchored scan
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/ms-parcel-api/analytics.ts supabase/functions/ms-parcel-api/index.ts analytics-client.js tests-ui.mjs index.html app.js ops.js snapshot-client.js
          git commit -m 'fix: anchor concurrent full snapshot after source probe'
          git push
