name: One-shot operational v20 runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-operational-v20-runner.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align patch script with current anchored tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/patch-v20.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import {band,route,validAnalytics,rowMatch,managerValue,bags,snapshotValid} from './data-model.js';", "import {band,route,validAnalytics,rowMatch,managerValue,bags,snapshotValid,decodeSnapshotRow} from './data-model.js';")
          s=s.replace("import {band,route,validAnalytics,rowMatch,rowCell,managerValue,bags,snapshotValid} from './data-model.js';", "import {band,route,validAnalytics,rowMatch,rowCell,managerValue,bags,snapshotValid,decodeSnapshotRow} from './data-model.js';")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply patch
        run: python tools/patch-v20.py
      - name: Validate frontend and data
        run: |
          node --check app.js
          node --check inspector.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check ops.js
          node --check shell.js
          node --check data-model.js
          node --check auth-client.js
          node --check dropdowns.js
          node tests-data.mjs
      - name: Validate six views
        run: |
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge
        run: deno check supabase/functions/ms-parcel-api/index.ts
      - name: Commit validated patch
        run: |
          git checkout -- .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js ops.js data-model.js analytics-client.js dropdowns.js ops.css index.html README.md tests-data.mjs tests-ui.mjs supabase/functions/ms-parcel-api/analytics.ts supabase/functions/ms-parcel-api/index.ts
          git commit -m 'fix: operational pages dropdowns copy and latest-action SLA'
          git push
