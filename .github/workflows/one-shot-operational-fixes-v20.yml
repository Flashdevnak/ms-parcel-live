name: One-shot operational fixes v20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-operational-fixes-v20.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply operational fixes
        shell: bash
        run: |
          cat > dropdowns.js <<'EOF'
          (()=>{
            const registry=new Map();
            let opened=null;
            const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
            function close(root){
              if(!root)return;
              root.classList.remove('open');
              root.querySelector('.persistent-select-trigger')?.setAttribute('aria-expanded','false');
              if(opened===root)opened=null;
            }
            function position(root){
              const trigger=root.querySelector('.persistent-select-trigger'),panel=root.querySelector('.persistent-select-panel');
              if(!trigger||!panel||!root.classList.contains('open'))return;
              const r=trigger.getBoundingClientRect(),vw=Math.max(document.documentElement.clientWidth||0,window.innerWidth||0),vh=Math.max(document.documentElement.clientHeight||0,window.innerHeight||0);
              const desired=Math.min(720,Math.max(r.width,360),vw-24),left=clamp(r.left,12,Math.max(12,vw-desired-12));
              panel.style.width=`${desired}px`;panel.style.left=`${left}px`;
              panel.style.maxHeight=`${Math.max(220,Math.min(520,vh-32))}px`;
              const below=vh-r.bottom,above=r.top;
              if(below>=Math.min(320,above)){panel.style.top=`${Math.min(vh-12,r.bottom+6)}px`;panel.style.bottom='auto';}
              else{panel.style.top='auto';panel.style.bottom=`${Math.max(12,vh-r.top+6)}px`;}
            }
            function selectedText(select){return String(select.selectedOptions?.[0]?.textContent||select.options?.[select.selectedIndex]?.textContent||'เลือก').trim();}
            function sync(root,select){
              const trigger=root.querySelector('.persistent-select-trigger'),list=root.querySelector('.persistent-select-options');
              if(!trigger||!list)return;
              const label=selectedText(select)||'เลือก';
              trigger.querySelector('span').textContent=label;trigger.title=label;trigger.disabled=select.disabled;
              list.replaceChildren(...[...select.options].map((option)=>{
                const b=document.createElement('button');b.type='button';b.className='persistent-select-option';b.dataset.value=option.value;b.textContent=String(option.textContent||option.value);b.title=String(option.textContent||option.value);b.disabled=option.disabled;b.setAttribute('aria-selected',String(option.value===select.value));
                b.addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();select.value=option.value;select.dispatchEvent(new Event('change',{bubbles:true}));sync(root,select);position(root);});
                return b;
              }));
              if(root.classList.contains('open'))position(root);
            }
            function enhance(select){
              if(!select||registry.has(select)||select.dataset.persistentSelect==='1')return;
              select.dataset.persistentSelect='1';select.classList.add('persistent-native');
              const root=document.createElement('div');root.className='persistent-select';
              root.innerHTML='<button type="button" class="persistent-select-trigger" aria-haspopup="listbox" aria-expanded="false"><span></span><i aria-hidden="true">▾</i></button><div class="persistent-select-panel" role="dialog"><div class="persistent-select-head"><strong>เลือกข้อมูล</strong><button type="button" class="persistent-select-close">ปิด</button></div><div class="persistent-select-options" role="listbox"></div></div>';
              select.insertAdjacentElement('afterend',root);registry.set(select,root);
              const trigger=root.querySelector('.persistent-select-trigger');
              trigger.addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();if(opened&&opened!==root)close(opened);const next=!root.classList.contains('open');if(next){root.classList.add('open');opened=root;trigger.setAttribute('aria-expanded','true');sync(root,select);position(root);}else close(root);});
              root.querySelector('.persistent-select-close').addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();close(root);});
              select.addEventListener('change',()=>sync(root,select));
              new MutationObserver(()=>sync(root,select)).observe(select,{childList:true,subtree:true,attributes:true});
              sync(root,select);
            }
            function scan(scope=document){scope.querySelectorAll?.('select').forEach(enhance);}
            function syncAll(){for(const [select,root] of registry)sync(root,select);}
            function init(){scan(document);new MutationObserver((records)=>{for(const record of records)for(const node of record.addedNodes){if(node.nodeType!==1)continue;if(node.matches?.('select'))enhance(node);scan(node);}}).observe(document.body,{childList:true,subtree:true});}
            document.addEventListener('click',(e)=>{if(opened&&!opened.contains(e.target))close(opened);});
            document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&opened)close(opened);});
            window.addEventListener('resize',()=>position(opened));window.addEventListener('scroll',()=>position(opened),true);
            window.addEventListener('ms-select-sync',syncAll);
            window.MSPersistentSelect={init,syncAll,closeCurrent:()=>close(opened)};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
          })();
          EOF

          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def rep(path,old,new,count=1):
              text=read(path)
              found=text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {found}: {old[:120]!r}')
              text=text.replace(old,new,count)
              write(path,text)

          # All waiting-age/SLA bands use the latest action timestamp.
          rep('data-model.js',
              "export const managerValue=r=>String(r?.store_manager_display||[r?.store_id&&`(${r.store_id})`,r?.store_name,r?.store_manager_name,r?.store_manager_phone].filter(Boolean).join(' · ')||r?.store_manager_phone||'-').trim()||'-';",
              "export function managerValue(r){const full=String(r?.store_manager_display||'').trim();if(full)return full;const managerName=String(r?.store_manager_name||'').trim(),managerPhone=String(r?.store_manager_phone||'').trim();if(!managerName&&!managerPhone)return'-';const storeId=String(r?.store_id||'').trim(),storeName=String(r?.store_name||'').trim(),storeLabel=`${storeId?`(${storeId})`:''}${storeName}`.trim();return [storeLabel,managerName,managerPhone].filter(Boolean).join(' · ')||'-';}")
          rep('data-model.js','b:band(r.real_arrive_time,now)','b:band(r.LastActionTime,now)')
          rep('data-model.js',"g.critical ||= band(r.real_arrive_time,now)==='over48'","g.critical ||= band(r.LastActionTime,now)==='over48'")
          rep('data-model.js','const b=band(r.real_arrive_time,now),p=time(r.plan_leave_time);','const b=band(r.LastActionTime,now),p=time(r.plan_leave_time);')

          rep('supabase/functions/ms-parcel-api/analytics.ts','schemaVersion:7','schemaVersion:8',2)
          rep('supabase/functions/ms-parcel-api/analytics.ts','band=bandOf(row?.real_arrive_time,now)','band=bandOf(row?.LastActionTime,now)')
          rep('supabase/functions/ms-parcel-api/index.ts','schemaVersion===7','schemaVersion===8')
          rep('analytics-client.js','schemaVersion===7','schemaVersion===8')

          rep('app.js','  const arrivedAt = parseMsTime(row.real_arrive_time);','  const lastActionAt = parseMsTime(row.LastActionTime);')
          rep('app.js','  const ageHours = Number.isFinite(arrivedAt) && now >= arrivedAt ? (now - arrivedAt) / 3600000 : null;','  const ageHours = Number.isFinite(lastActionAt) && now >= lastActionAt ? (now - lastActionAt) / 3600000 : null;')
          rep('app.js',"else parts.push(`ค้าง ${formatMinutes(risk.ageHours * 60)}`);","else parts.push(`ค้างจากดำเนินการล่าสุด ${formatMinutes(risk.ageHours * 60)}`);")
          rep('app.js',"? `<span class=\"risk-chip risk-missed\">ตกรอบ ${esc(formatMinutes(risk.overdueMinutes))}</span>`","? `<span class=\"risk-chip risk-missed\">เกินเวลาแผน ${esc(formatMinutes(risk.overdueMinutes))}</span>`")
          rep('app.js',"window.dispatchEvent(new CustomEvent('ms-live-state',{detail:{total:state.total,count:state.rows.length,sourceAt,branchId:branchId()}}));","window.dispatchEvent(new CustomEvent('ms-live-state',{detail:{total:state.total,count:state.rows.length,rows:state.rows,sourceAt,branchId:branchId()}}));")

