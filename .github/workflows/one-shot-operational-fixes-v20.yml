          css='''\n/* Persistent dropdowns: selecting an option does not close the list. */\n.persistent-native{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;margin:0!important;padding:0!important;border:0!important}\n.persistent-select{position:relative;width:100%;min-width:0}.persistent-select-trigger{width:100%;min-height:44px;border:1px solid #b7c6d4;border-radius:8px;background:#fff;color:var(--ink);padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}.persistent-select-trigger span{white-space:normal!important;overflow-wrap:anywhere;line-height:1.45}.persistent-select-trigger i{font-style:normal;flex:0 0 auto}.persistent-select.open .persistent-select-trigger{outline:3px solid #2977d5;outline-offset:2px}.persistent-select-panel{display:none;position:fixed;z-index:10000;background:#fff;border:1px solid #9eb3c7;border-radius:10px;box-shadow:0 18px 55px #10263b33;overflow:hidden}.persistent-select.open .persistent-select-panel{display:flex;flex-direction:column}.persistent-select-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:#f5f8fb}.persistent-select-head strong{font-size:14px}.persistent-select-close{border:1px solid #9eb3c7;background:#fff;border-radius:7px;min-height:34px;padding:5px 12px;font-weight:700}.persistent-select-options{overflow:auto;padding:6px;display:grid;gap:2px}.persistent-select-option{border:0;background:#fff;color:var(--ink);text-align:left;padding:9px 10px;border-radius:6px;white-space:normal;overflow-wrap:anywhere;line-height:1.45}.persistent-select-option:hover{background:#eef5ff}.persistent-select-option[aria-selected=\"true\"]{background:#1d334d;color:#fff}.global-destination-grid .persistent-select-trigger{min-height:48px}.global-destination-grid label:has(#manager-phone-filter) .persistent-select-trigger{align-items:flex-start}.app-nav-inner.has-admin-actions{grid-template-columns:repeat(8,minmax(0,1fr))}.admin-nav-btn{background:#223b57!important;color:#fff!important}.live-fallback-notice{margin-bottom:16px}\n@media(max-width:640px){.app-nav-inner.has-admin-actions{grid-template-columns:repeat(4,minmax(0,1fr))}.persistent-select-panel{max-width:calc(100vw - 24px)!important}.persistent-select-option{font-size:14px}}\n'''
          text=read('ops.css')
          if '/* Persistent dropdowns:' not in text: text += css
          write('ops.css',text)

          # Load dropdown component and bump all frontend assets so old browser cache cannot preserve native/select behavior.
          rep('index.html','  <script type="module" src="ops.js?v=20260906-manager-lossless-v1"></script>\n  <link rel="stylesheet" href="ops.css?v=20260906-manager-lossless-v1" />','  <script type="module" src="ops.js?v=20260906-manager-lossless-v1"></script>\n  <script type="module" src="dropdowns.js?v=20260906-manager-lossless-v1"></script>\n  <link rel="stylesheet" href="ops.css?v=20260906-manager-lossless-v1" />')
          version_old='20260906-manager-lossless-v1';version_new='20260906-operational-v20'
          for path in ['index.html','app.js','ops.js','analytics-client.js','snapshot-client.js']:
              text=read(path).replace(version_old,version_new)
              write(path,text)

          # CI validates dropdown code too.
          rep('.github/workflows/pages.yml','          node --check auth-client.js\n          node tests-data.mjs','          node --check auth-client.js\n          node --check dropdowns.js\n          node tests-data.mjs')

          # Data tests: latest action drives waiting age and fallback manager preserves parentheses exactly.
          rep('tests-data.mjs',"import {band,route,validAnalytics,rowMatch,managerValue,bags,snapshotValid} from './data-model.js';","import {band,route,validAnalytics,rowMatch,rowCell,managerValue,bags,snapshotValid} from './data-model.js';")
          rep('tests-data.mjs',"assert.equal(managerValue({store_manager_phone:'0812345678'}),'0812345678');","assert.equal(managerValue({store_manager_phone:'0812345678'}),'0812345678');\nassert.equal(managerValue({store_id:'TH00000001',store_name:'01 TEST_HUB-A',store_manager_name:'นาย ทดสอบ',store_manager_phone:'0812345678'}),'(TH00000001)01 TEST_HUB-A · นาย ทดสอบ · 0812345678');\nassert.equal(rowCell({real_arrive_time:'2026-09-01 00:00:00',LastActionTime:'2026-09-06 00:00:00'},branch,Date.parse('2026-09-06T01:00:00+07:00')).b,'under3');")

          # UI tests: schema v8, status is fully expanded, dropdown remains open after selection, and row pages fall back to live data.
          rep('tests-ui.mjs',"real_arrive_time:'2026-09-05 23:00:00',pack_num:'B1',LastAction_name:'คัดแยก',state_name:","real_arrive_time:'2026-09-05 23:00:00',pack_num:'B1',LastAction_name:'คัดแยก',LastActionTime:'2026-09-05 23:30:00',state_name:")
          rep('tests-ui.mjs','schemaVersion:7','schemaVersion:8')
          rep('tests-ui.mjs',"const managerOptions=[...w.document.querySelector('#manager-phone-filter').options].map(o=>o.textContent);assert.ok(managerOptions.some(v=>v.includes('TEST_HUB-A')&&v.includes('ผู้จัดการ เอ')&&v.includes('0811111111')));",
              "const managerOptions=[...w.document.querySelector('#manager-phone-filter').options].map(o=>o.textContent);assert.ok(managerOptions.some(v=>v.includes('(TH00000001)01 TEST_HUB-A')&&v.includes('ผู้จัดการ เอ')&&v.includes('0811111111')));\nvm.runInContext(readFileSync('dropdowns.js','utf8'),dom.getInternalVMContext());w.MSPersistentSelect.init();const managerWidget=w.document.querySelector('#manager-phone-filter').nextElementSibling;managerWidget.querySelector('.persistent-select-trigger').click();const fullManagerOption=[...managerWidget.querySelectorAll('.persistent-select-option')].find(b=>b.textContent===M1);fullManagerOption.click();assert.equal(managerWidget.classList.contains('open'),true);assert.match(managerWidget.querySelector('.persistent-select-trigger').textContent,/\\(TH00000001\\)01 TEST_HUB-A/);w.document.querySelector('#manager-phone-filter').value='';w.document.querySelector('#manager-phone-filter').dispatchEvent(new w.Event('change'));flush();")
          rep('tests-ui.mjs',"nav('status');assert.equal(w.document.querySelectorAll('.work-charts .work-panel').length,3);",
              "nav('status');assert.equal(w.document.querySelectorAll('.work-charts .work-panel').length,3);const many=vm.runInContext(\"chart(Array.from({length:12},(_,i)=>({name:'S'+i,count:1})), 'action', 12, true)\",dom.getInternalVMContext());assert.doesNotMatch(many,/work-more/);assert.match(w.document.querySelector('#work-status').textContent,/คัดลอกตาราง/);")
          rep('tests-ui.mjs',"emit('ms-full-analytics',{...a,complete:false,total:3,scanned:2,snapshotId:null});flush();nav('dashboard');assert.match(w.document.querySelector('#work-dashboard').textContent,/ข้อมูลบางส่วน/);const beforeCopy=clipboard;await vm.runInContext(\"copy('dashboard')\",dom.getInternalVMContext());assert.equal(clipboard,beforeCopy);nav('backlog');emit('ms-session-reset');flush();assert.match(w.document.querySelector('#work-backlog').textContent,/รอภาพรวม/);",
              "emit('ms-full-analytics',{...a,complete:false,total:3,scanned:2,snapshotId:null});emit('ms-live-state',{branchId:1,total:200,rows:fixtures,sourceAt:'2026-09-06T00:00:00+07:00'});flush();nav('dashboard');assert.match(w.document.querySelector('#work-dashboard').textContent,/ข้อมูลบางส่วน/);const beforeCopy=clipboard;await vm.runInContext(\"copy('dashboard')\",dom.getInternalVMContext());assert.equal(clipboard,beforeCopy);nav('parcels');flush();assert.equal(w.document.querySelectorAll('#work-parcels .parcel-row').length,2);assert.match(w.document.querySelector('#work-parcels').textContent,/ข้อมูลสดหน้าปัจจุบัน/);nav('bagging');flush();assert.equal(w.document.querySelectorAll('#work-bagging .work-bag').length,1);nav('backlog');flush();assert.ok(w.document.querySelectorAll('#work-backlog .parcel-row').length>=1);emit('ms-session-reset');flush();assert.match(w.document.querySelector('#work-backlog').textContent,/รอภาพรวม|ยังไม่มีข้อมูลสด/);")
          rep('tests-ui.mjs',"console.log('PASS: six views, no partial fallback, full manager column filter/display, FD/LH charts and weights, mixed bag, details, copy and logout clearing');",
              "assert.match(readFileSync('app.js','utf8'),/nav-users-btn/);console.log('PASS: six views, live fallback, latest-action waiting age, expanded Status, persistent full manager dropdown, copy tables, admin nav, mixed bag, details and logout clearing');")

          # Documentation notes.
          readme=read('README.md')
          readme=readme.replace('- ข้อมูล `ผู้จัดการสาขา` ใช้ข้อมูลจริงครบจาก source row: `store_id` + `store_name` + `store_manager_name` + `store_manager_phone`','- ข้อมูล `ผู้จัดการสาขา` ใช้ข้อมูลจริงครบจาก source row: `store_id` + `store_name` + `store_manager_name` + `store_manager_phone`; แสดง Store ID พร้อมวงเล็บและไม่ตัดข้อความ')
          if 'เวลาค้างทุกหน้าใช้ `LastActionTime`' not in readme:
              readme=readme.replace('## Shared filters','## Waiting-time rule\n- เวลาค้างทุกหน้าใช้ `LastActionTime` (เวลาที่ดำเนินการล่าสุด) เป็นจุดเริ่มต้น ไม่ใช้ `real_arrive_time` สำหรับอายุค้าง\n- หน้ารายการ/SLA/Bagging แสดง live page ทันทีระหว่างรอ Full Snapshot และติดป้ายชัดเจนว่าไม่ใช่ทั้งคลัง\n- Dropdown ทุกตัวเป็นแบบ persistent: เลือกค่าแล้วรายการยังเปิดอยู่ ปิดเมื่อกดปิด/กด dropdown อื่น/คลิกออกนอกกล่อง\n- ทุกตาราง/กลุ่มสรุปหลักมีปุ่มคัดลอกตาราง\n\n## Shared filters')
          write('README.md',readme)
          PY

      - name: Validate frontend and data model
        run: |
          node --check app.js
          node --check inspector.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check ops.js
          node --check shell.js
          node --check data-model.js
          node --check auth-client.js
          node --check dropdowns.js
          node tests-data.mjs

      - name: Validate workspace UI
        run: |
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Edge
        run: deno check supabase/functions/ms-parcel-api/index.ts

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js ops.js data-model.js inspector.js shell.js analytics-client.js dropdowns.js ops.css index.html README.md tests-data.mjs tests-ui.mjs .github/workflows/pages.yml supabase/functions/ms-parcel-api/analytics.ts supabase/functions/ms-parcel-api/index.ts
          git commit -m 'fix: operational pages dropdowns copy and latest-action SLA'
          git push
