name: One-shot manager multiselect v22 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-manager-multiselect-v22-final.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse v22 patch scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          text=Path('.github/workflows/one-shot-manager-multiselect-v22.yml').read_text(encoding='utf-8')
          def extract(name):
              anchor=f'      - name: {name}\n'
              start=text.index(anchor)
              run=text.index('        run: |\n',start)+len('        run: |\n')
              end=text.find('\n      - name:',run)
              if end<0:end=len(text)
              lines=text[run:end].splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          for name in ['Replace dropdown engine with persistent checkbox multiselect','Apply exact source-column and multiselect patches']:
              subprocess.run(['bash','-e','-o','pipefail','-c',extract(name)],check=True)
          PY

      - name: Apply validated follow-up fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data-model.js')
          s=p.read_text(encoding='utf-8')
          bad="export function managerValue(r){const raw=v=>v===null||v===undefined?'':String(v),obj=r||{},hasRaw=['store_id','store_name','store_manager_name','store_manager_phone'].some(k=>Object.prototype.hasOwnProperty.call(obj,k));if(hasRaw){const storeLine=`(${raw(obj.store_id)})${raw(obj.store_name)}`;return [storeLine,raw(obj.store_manager_name),raw(obj.store_manager_phone)].filter((v,i)=>i===0||v!=='').join('\\n');}const full=raw(obj.store_manager_display);return full||'()';}"
          good="export function managerValue(r){const raw=v=>v===null||v===undefined?'':String(v),obj=r||{},full=raw(obj.store_manager_display);if(full)return full;const hasRaw=['store_id','store_name','store_manager_name','store_manager_phone'].some(k=>Object.prototype.hasOwnProperty.call(obj,k));if(hasRaw){const storeLine=`(${raw(obj.store_id)})${raw(obj.store_name)}`;return [storeLine,raw(obj.store_manager_name),raw(obj.store_manager_phone)].filter((v,i)=>i===0||v!=='').join('\\n');}return'()';}"
          if bad not in s:raise SystemExit('managerValue anchor missing')
          s=s.replace(bad,good)
          old="function pick(filter,value){if(filter instanceof Set)return filter.size===0||filter.has(value);if(Array.isArray(filter))return filter.length===0||filter.includes(value);return !filter||filter===value;}"
          new="function pick(filter,value){if(filter&&typeof filter.has==='function'&&typeof filter.size==='number')return filter.size===0||filter.has(value);if(Array.isArray(filter))return filter.length===0||filter.includes(value);return !filter||filter===value;}"
          if old not in s:raise SystemExit('pick anchor missing')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY

      - name: Validate frontend and data
        run: |
          node --check app.js
          node --check inspector.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check ops.js
          node --check shell.js
          node --check data-model.js
          node --check auth-client.js
          node --check dropdowns.js
          node tests-data.mjs

      - name: Validate six views and checkbox multiselect
        run: |
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge
        run: deno check supabase/functions/ms-parcel-api/index.ts

      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dropdowns.js dropdown-fix.css data-model.js ops.js shell.js index.html app.js analytics-client.js snapshot-client.js README.md tests-data.mjs tests-ui.mjs supabase/functions/ms-parcel-api/ms.ts supabase/functions/ms-parcel-api/analytics.ts supabase/functions/ms-parcel-api/index.ts
          git commit -m 'fix: preserve exact manager column and checkbox multiselect filters'
          git push
