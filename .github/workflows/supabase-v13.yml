name: Activate Supabase v13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      SUPABASE_ACCESS_TOKEN_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ACCESS_TOKEN_B: ${{ secrets.SUPABASE_TOKEN }}
      SUPABASE_ACCESS_TOKEN_C: ${{ secrets.SUPABASE_PAT }}
      SUPABASE_ACCESS_TOKEN_D: ${{ vars.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ACCESS_TOKEN_E: ${{ vars.SUPABASE_TOKEN }}
      PROJECT_REF: afhnfnfbqdqqzrghovfc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Supabase token
        shell: bash
        run: |
          TOKEN="$SUPABASE_ACCESS_TOKEN_A"
          SOURCE='secret:SUPABASE_ACCESS_TOKEN'
          if [ -z "$TOKEN" ] && [ -n "$SUPABASE_ACCESS_TOKEN_B" ]; then TOKEN="$SUPABASE_ACCESS_TOKEN_B"; SOURCE='secret:SUPABASE_TOKEN'; fi
          if [ -z "$TOKEN" ] && [ -n "$SUPABASE_ACCESS_TOKEN_C" ]; then TOKEN="$SUPABASE_ACCESS_TOKEN_C"; SOURCE='secret:SUPABASE_PAT'; fi
          if [ -z "$TOKEN" ] && [ -n "$SUPABASE_ACCESS_TOKEN_D" ]; then TOKEN="$SUPABASE_ACCESS_TOKEN_D"; SOURCE='var:SUPABASE_ACCESS_TOKEN'; fi
          if [ -z "$TOKEN" ] && [ -n "$SUPABASE_ACCESS_TOKEN_E" ]; then TOKEN="$SUPABASE_ACCESS_TOKEN_E"; SOURCE='var:SUPABASE_TOKEN'; fi
          if [ -z "$TOKEN" ]; then
            echo 'No supported Supabase management token is configured.'
            exit 2
          fi
          echo "Using configured token source: $SOURCE"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy Edge v13
        shell: bash
        run: |
          npx --yes supabase@latest functions deploy ms-parcel-api \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Backend activation complete
        run: echo 'v13 Edge deployment completed; no database migration is required.'
