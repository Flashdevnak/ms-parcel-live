name: Activate Supabase v13

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: afhnfnfbqdqqzrghovfc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured in repository or github-pages environment secrets.'
            exit 2
          fi

      - name: Apply v13 migration
        shell: bash
        run: |
          python - <<'PY' > /tmp/query.json
          import json
          from pathlib import Path
          sql = Path('supabase/migrations/20260906_v13_full_snapshot_pages.sql').read_text()
          print(json.dumps({'query': sql}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json > /tmp/migration-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/migration-result.json')
          data=json.loads(p.read_text() or '{}')
          print('Migration API completed.')
          if isinstance(data, dict) and data.get('error'):
              raise SystemExit(str(data['error']))
          PY

      - name: Deploy Edge v13
        shell: bash
        run: |
          npx --yes supabase@latest functions deploy ms-parcel-api \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Backend activation complete
        run: echo 'v13 migration and Edge deployment completed.'
