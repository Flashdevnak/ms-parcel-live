name: One-shot Smart Leader Responsive v23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-smart-leader-v23.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Smart Leader v23 frontend upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def replace_once(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 anchor, found {n}')
              return text.replace(old,new,1)

          ops=read('ops.js')
          ops=ops.replace('20260906-manager-multi-v22','20260906-smart-leader-v23')

          density_anchor="let bands=new Set(BANDS);try{const saved=JSON.parse(localStorage.getItem('ms-workspace-bands'));if(Array.isArray(saved))bands=new Set(saved.filter(b=>BANDS.includes(b)));}catch{}"
          density_new=density_anchor+"\nlet leaderSort='risk',density='comfortable';try{density=localStorage.getItem('ms-workspace-density')==='compact'?'compact':'comfortable';}catch{}"
          ops=replace_once(ops,density_anchor,density_new,'density state')

          smart_code=r'''
function selectedTimeText(){if(bands.size===BANDS.length)return'ทุกช่วงเวลา';if(!bands.size)return'ไม่ได้เลือกช่วงเวลา';return BANDS.filter(b=>bands.has(b)).map(b=>LABELS[BANDS.indexOf(b)]).join(', ');}
function setBandPreset(key){const preset={all:BANDS,under24:BANDS.slice(0,7),'24to48':['24to48'],over48:['over48'],'24plus':['24to48','over48'],unknown:['unknown']}[key]||BANDS;bands=new Set(preset);}
function pageTimeTools(){return `<section class="page-time-filter"><div class="page-time-head"><div><strong>ช่วงเวลาหน้านี้</strong><span>ใช้ตัวกรองเดียวกับแดชบอร์ด · ไม่เรียก API เพิ่ม</span></div><div class="page-time-presets">${[['all','ทั้งหมด'],['under24','<24'],['24to48','24–48'],['over48','>48'],['24plus','≥24'],['unknown','ไม่ทราบ']].map(([v,l])=>button(l,`data-band-preset="${v}"`)).join('')}</div></div><div class="page-time-grid">${BANDS.map((b,i)=>`<label><input type="checkbox" data-view-band="${b}"><span>${LABELS[i]}</span><b data-view-band-count="${b}">—</b></label>`).join('')}</div></section>`;}
function activeFilterRibbon(cells){const f=filters(),chips=[];const chip=(key,label)=>chips.push(`<button type="button" class="filter-chip" data-clear-filter="${key}" title="แตะเพื่อล้างตัวกรองนี้">${label}<span>×</span></button>`);if(bands.size!==BANDS.length)chip('time',`เวลา ${esc(selectedTimeText())}`);if(f.lh.size)chip('lh',`LH ${num(f.lh.size)} HUB`);if(f.fd.size)chip('fd',`FD ${num(f.fd.size)} สาขา`);if(f.action.size)chip('action',`ดำเนินการ ${num(f.action.size)}`);if(f.manager.size)chip('manager',`ผู้จัดการ ${num(f.manager.size)}`);const total=metrics(cells).count;return `<div class="active-filter-ribbon"><div class="filter-result"><span>ผลหลังกรอง</span><strong>${num(total)} ชิ้น</strong><small>${chips.length?`${chips.length} กลุ่มตัวกรองทำงาน`:'ยังไม่เจาะจงเพิ่ม'}</small></div><div class="filter-chip-list">${chips.join('')||'<span class="filter-chip-empty">ทุกปลายทาง · ทุกการดำเนินการ · ทุกผู้จัดการ</span>'}</div>${button(density==='compact'?'มุมมองสบาย':'มุมมองกระชับ','data-density-toggle="1"','density-toggle')}</div>`;}
function leaderGroups(cells,r){const total=Math.max(1,metrics(cells).count),map=new Map();for(const c of cells){if(c.r!==r||!c.d)continue;let g=map.get(c.d);if(!g){g={name:c.d,route:r,count:0,weight:0,overdue:0,over48:0,noBag24:0,managers:new Map()};map.set(c.d,g);}const count=Number(c.c||0);g.count+=count;g.weight+=Number(c.w||0);g.overdue+=Number(c.o||0);if(c.b==='over48')g.over48+=count;if(['24to48','over48'].includes(c.b))g.noBag24+=Math.max(0,count-Number(c.g||0));const manager=String(c.m||'ไม่ระบุ');g.managers.set(manager,(g.managers.get(manager)||0)+count);}const out=[...map.values()].map(g=>{const score=Math.min(100,Math.round((g.over48*55+g.overdue*30+g.noBag24*15)/Math.max(1,g.count))),level=score>=70?'critical':score>=40?'high':score>=15?'watch':'normal';return {...g,score,level,share:g.count/total*100,managers:[...g.managers].map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'th'))};});return out.sort((a,b)=>leaderSort==='count'?b.count-a.count:leaderSort==='weight'?b.weight-a.weight:b.score-a.score||b.over48-a.over48||b.overdue-a.overdue||b.count-a.count);}
function leaderAdvice(g){if(g.noBag24>0)return`เช็กการสร้างแบ็ก ${num(g.noBag24)} ชิ้นที่ค้าง ≥24 ชม.`;if(g.over48>0)return`เร่งเคลียร์ >48 ชม. ${num(g.over48)} ชิ้น`;if(g.overdue>0)return`ตรวจเวลาแผน ${num(g.overdue)} ชิ้นที่เลยกำหนด`;return'สถานะสมดุล ใช้ติดตามแนวโน้มต่อได้';}
function riskLabel(g){return g.level==='critical'?'วิกฤต':g.level==='high'?'เสี่ยงสูง':g.level==='watch'?'เฝ้าระวัง':'ปกติ';}
function leaderHierarchy(cells){const lh=leaderGroups(cells,'lh'),fd=leaderGroups(cells,'fd'),all=[...lh,...fd].sort((a,b)=>b.score-a.score||b.count-a.count),hot=all.slice(0,3);const lane=(r,gs,title,subtitle)=>`<section class="leader-lane"><div class="leader-lane-head"><div><span class="route-tag ${r}">${r.toUpperCase()}</span><strong>${title}</strong><small>${subtitle}</small></div><b>${num(gs.reduce((s,g)=>s+g.count,0))} ชิ้น · ${num(gs.length)} กลุ่ม</b></div><div class="leader-groups">${gs.slice(0,24).map((g,i)=>`<details class="leader-group ${g.level}" ${i<2?'open':''}><summary><span><b>${esc(g.name)}</b><small>${num(g.count)} ชิ้น · ${g.share.toFixed(1)}% ของชุดที่กรอง</small></span><span class="risk-score ${g.level}">${g.score}/100 · ${riskLabel(g)}</span></summary><div class="leader-stats"><span>น้ำหนัก<b>${kg(g.weight)} กก.</b></span><span>>48 ชม.<b>${num(g.over48)}</b></span><span>เกินเวลาแผน<b>${num(g.overdue)}</b></span><span>ไม่มีแบ็ก ≥24ชม.<b>${num(g.noBag24)}</b></span></div><p class="leader-advice">${leaderAdvice(g)}</p><div class="leader-manager-grid">${g.managers.slice(0,6).map(m=>`<div><span>${esc(m.name)}</span><b>${num(m.count)} ชิ้น</b></div>`).join('')||'<div><span>ไม่พบผู้จัดการ</span><b>—</b></div>'}</div>${g.managers.length>6?`<small class="leader-more">อีก ${num(g.managers.length-6)} ผู้จัดการ</small>`:''}<div class="leader-open">${button('เปิดรายการกลุ่มนี้',`data-destination="${esc(g.name)}" data-route="${r}"`)}</div></details>`).join('')||blank('ไม่พบข้อมูลกลุ่มนี้')}</div>${gs.length>24?`<p class="work-caption">แสดง 24 จาก ${num(gs.length)} กลุ่ม · ใช้ตัวกรองปลายทางเพื่อเจาะกลุ่มอื่น</p>`:''}</section>`;return `<section class="work-panel leader-board"><div class="work-section-head leader-title"><div><h3>Leader / Hierarchy View</h3><span>แยก HUB ใคร HUB มัน · สาขาใครสาขามัน · ผู้จัดการอยู่ใต้ปลายทางของตัวเอง</span></div><div class="work-actions"><select id="leader-sort" aria-label="เรียง Leader View"><option value="risk">ความเสี่ยงสูงก่อน</option><option value="count">จำนวนมากก่อน</option><option value="weight">น้ำหนักมากก่อน</option></select>${button('คัดลอก Leader Report','data-copy-table="leaders"')}</div></div><div class="smart-hotspots">${hot.map((g,i)=>`<button class="hotspot-card ${g.level}" data-destination="${esc(g.name)}" data-route="${g.route}"><span>HOT ${i+1} · ${g.route.toUpperCase()}</span><strong>${esc(g.name)}</strong><b>${g.score}/100</b><small>${leaderAdvice(g)}</small></button>`).join('')||blank('ยังไม่มี Hotspot')}</div><div class="leader-lanes">${lane('lh',lh,'LH HUB','HUB ปลายทาง แยกเป็น HUB ใคร HUB มัน')}${lane('fd',fd,'FD สาขา','สาขาปลายทาง แยกเป็นสาขาใครสาขามัน')}</div></section>`;}
'''.strip()
          ops=replace_once(ops,'function setView(next){',smart_code+'\nfunction setView(next){','smart helpers')

          heat_old='BANDS.map((b,i)=>`<td>${button(num(g.bands[b]),'
          heat_new='BANDS.map((b,i)=>`<td data-label="${esc(LABELS[i])}">${button(num(g.bands[b]),'
          ops=replace_once(ops,heat_old,heat_new,'mobile heat labels')

          dash_anchor='</section><details class="work-more"><summary>สรุปอายุรายวันจาก MS (รอบข้อมูลแยก)</summary>'
          dash_new='</section>${leaderHierarchy(cells)}<details class="work-more"><summary>สรุปอายุรายวันจาก MS (รอบข้อมูลแยก)</summary>'
          ops=replace_once(ops,dash_anchor,dash_new,'leader dashboard insertion')

          leader_copy="""}else if(kind==='leaders'){const gs=[...leaderGroups(cells,'lh'),...leaderGroups(cells,'fd')];title='Leader / Hierarchy Report';lines=[['ประเภท','ปลายทาง','จำนวน','สัดส่วน','Risk Score','ระดับ','น้ำหนัก(กก.)','เกิน48ชม.','เกินเวลาแผน','ไม่มีแบ็ก>=24ชม.','ผู้จัดการหลัก'].join('\\t'),...gs.map(g=>[g.route.toUpperCase(),g.name,g.count,g.share.toFixed(1)+'%',g.score,riskLabel(g),kg(g.weight),g.over48,g.overdue,g.noBag24,g.managers[0]?.name||'ไม่ระบุ'].map(tsv).join('\\t'))];"""
          ops=replace_once(ops,"}else if(kind==='list'){",leader_copy+"}else if(kind==='list'){",'leader copy')

          render_re=re.compile(r"function render\(\)\{.*?\}\nasync function copy",re.S)
          render_new=r'''function render(){renderHealth();rebuildFilters();document.body.classList.toggle('density-compact',density==='compact');const content=$(`work-${view}`);if(!content)return;content.innerHTML=view==='dashboard'?dashboard():view==='status'?statusView():view==='weight'?weights():view==='bagging'?bagList():rowList();const currentCells=usable()?selectedCells():[];const tools=(view==='dashboard'?'':pageTimeTools())+(usable()?activeFilterRibbon(currentCells):'');if(tools)content.insertAdjacentHTML('afterbegin',tools);if(usable()&&!ready())content.insertAdjacentHTML('afterbegin',`<div class="partial-notice" role="status"><strong>ข้อมูลบางส่วน · ${num(a.scanned)} / ${num(a.total)} รายการ</strong><span>กราฟและตัวกรองด้านล่างครอบคลุมเฉพาะรายการที่รวบรวมได้ ยังไม่ใช่ยอดทั้งคลัง</span></div>`);const base=usable()?a.cells.filter(c=>match(c,{...filters(),bands:null})):[];document.querySelectorAll('[data-band-count],[data-view-band-count]').forEach(el=>{const key=el.dataset.bandCount||el.dataset.viewBandCount;el.textContent=usable()?num(base.filter(c=>c.b===key).reduce((s,c)=>s+c.c,0)):'—';});document.querySelectorAll('[data-dashboard-band],[data-view-band]').forEach(el=>{const key=el.dataset.dashboardBand||el.dataset.viewBand;el.checked=bands.has(key);});if($('route-sort'))$('route-sort').value=routeSort;if($('leader-sort'))$('leader-sort').value=leaderSort;document.querySelectorAll('[data-work-risk]').forEach(el=>{el.classList.toggle('chosen',el.dataset.workRisk===risk);el.setAttribute('aria-pressed',el.dataset.workRisk===risk?'true':'false');});window.MSPersistentSelect?.syncAll?.();}
async function copy'''
          ops,n=render_re.subn(render_new,ops,count=1)
          if n!=1: raise SystemExit(f'render replacement failed: {n}')

          click_anchor="document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;"
          click_new=click_anchor+"if(d.bandPreset){setBandPreset(d.bandPreset);saveFilters();}if(d.clearFilter){if(d.clearFilter==='time')bands=new Set(BANDS);else{const id={lh:'hub-filter',fd:'branch-filter',action:'ops-action-filter',manager:'manager-phone-filter'}[d.clearFilter];if(id)clearMulti(id);}saveFilters();}if(d.densityToggle){density=density==='compact'?'comfortable':'compact';try{localStorage.setItem('ms-workspace-density',density);}catch{}schedule();}if(Object.prototype.hasOwnProperty.call(d,'scrollTop')){window.scrollTo?.({top:0,behavior:'smooth'});}"
          ops=replace_once(ops,click_anchor,click_new,'delegated smart clicks')

          change_old="document.addEventListener('change',e=>{if(e.target.id==='route-sort'){routeSort=e.target.value;schedule();}if(e.target.matches('[data-list-status]')){listStatus=e.target.value;page=1;schedule();}});"
          change_new="document.addEventListener('change',e=>{if(e.target.matches('[data-view-band]')){const key=e.target.dataset.viewBand;e.target.checked?bands.add(key):bands.delete(key);saveFilters();return;}if(e.target.id==='route-sort'){routeSort=e.target.value;schedule();}if(e.target.id==='leader-sort'){leaderSort=e.target.value;schedule();}if(e.target.matches('[data-list-status]')){listStatus=e.target.value;page=1;schedule();}});"
          ops=replace_once(ops,change_old,change_new,'smart changes')

          bind_old="function bind(){document.querySelectorAll('[data-page-nav]')"
          bind_new="function bind(){const updateTop=()=>{$('work-top-button')?.classList.toggle('visible',(window.scrollY||0)>600);};window.addEventListener('scroll',updateTop,{passive:true});updateTop();document.querySelectorAll('[data-page-nav]')"
          ops=replace_once(ops,bind_old,bind_new,'top button bind')

          dialog_anchor=" document.body.insertAdjacentHTML('beforeend','<dialog id=\"parcel-dialog\""
          dialog_new=" document.body.insertAdjacentHTML('beforeend','<button id=\"work-top-button\" class=\"work-top-button\" type=\"button\" data-scroll-top aria-label=\"กลับด้านบน\">↑</button>');\n document.body.insertAdjacentHTML('beforeend','<dialog id=\"parcel-dialog\""
          ops=replace_once(ops,dialog_anchor,dialog_new,'top button structure')

          write('ops.js',ops)

          css=read('ops.css')
          smart_css=r'''

/* Smart Leader v23 — client-side only; no extra API/MS/Supabase requests. */
.page-title{text-align:center}.page-title h2{margin-left:auto;margin-right:auto}.work-health{text-align:center}.work-health>div{align-items:center;min-width:0}.work-health>div>*{max-width:100%;overflow-wrap:anywhere}.work-kpi{text-align:center;align-items:center;justify-content:center}.work-kpi>*{max-width:100%;overflow-wrap:anywhere}.work-actions-line{text-align:center;justify-content:center}.work-actions-line>.work-actions{justify-content:center}.work-section-head{text-align:center;justify-content:center}.work-section-head>div:first-child{min-width:0;flex:1 1 360px}.work-section-head>.work-actions{justify-content:center}.destination-card{text-align:center;align-items:center;justify-content:center}.destination-card>div:first-child,.destination-card footer{justify-content:center}.destination-card strong,.destination-card b,.destination-card span{max-width:100%;overflow-wrap:anywhere}.work-bar{text-align:center;align-items:center}.work-bar>span{white-space:pre-line!important;text-align:center}.weight-totals>div{text-align:center}.parcel-row{text-align:center}.parcel-row>div{align-items:center;text-align:center}.parcel-row .open-detail{text-align:center}.work-bag{text-align:center;align-items:stretch}.work-bag>div{justify-content:center}.bag-numbers{text-align:center}.parcel-drawer dl>div{text-align:center}.parcel-drawer dd{white-space:pre-line}.daily-summary{justify-content:center;text-align:center}.heat-table th,.heat-table td{text-align:center!important}.heat-table th:first-child{text-align:center!important}.global-time-grid label,.page-time-grid label{text-align:center;justify-content:center;min-width:0}.global-time-grid b,.page-time-grid b{text-align:center!important}.global-destination-grid label{text-align:center}.global-destination-grid .persistent-select-trigger{align-items:center;text-align:center}.global-destination-grid .persistent-select-trigger>span{width:100%;text-align:center}.work-button,.work-actions select,.filter-chip,.leader-group,.hotspot-card,.parcel-row,.destination-card{min-width:0;max-width:100%}.work-button{white-space:normal;overflow-wrap:anywhere}.work-panel,.work-charts,.destination-grid,.bag-grid,.leader-lanes,.leader-manager-grid,.smart-hotspots,.page-time-grid{min-width:0}.page-time-filter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px;box-shadow:0 1px 0 #15233408}.page-time-head{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center}.page-time-head>div:first-child{display:flex;flex-direction:column;gap:2px;flex:1 1 340px}.page-time-head span{font-size:13px;color:var(--muted)}.page-time-presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.page-time-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:12px}.page-time-grid label{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:54px;padding:7px;border:1px solid var(--line);border-radius:8px;background:#f7f9fc;cursor:pointer}.page-time-grid label:has(input:checked){background:#eaf2ff;border-color:#6b93c4}.page-time-grid span{font-size:13px}.page-time-grid b{width:100%;font-size:13px;font-variant-numeric:tabular-nums}.active-filter-ribbon{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:#172e49;color:#fff;border-radius:12px;padding:12px 14px;margin:0 0 16px;min-width:0}.filter-result{text-align:center;min-width:120px}.filter-result>*{display:block}.filter-result span,.filter-result small{font-size:12px;color:#c5d6e7}.filter-result strong{font-size:24px;font-variant-numeric:tabular-nums}.filter-chip-list{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-width:0}.filter-chip{border:1px solid #67809b;background:#243f5e;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:normal}.filter-chip span{font-weight:800}.filter-chip-empty{font-size:13px;color:#c5d6e7;text-align:center}.density-toggle{background:#fff;color:#17375e;border-color:#fff}.leader-board{overflow:hidden}.leader-title{border-bottom:1px solid var(--line);padding-bottom:14px}.leader-title h3{font-size:20px}.smart-hotspots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 18px}.hotspot-card{border:1px solid var(--line);border-top:4px solid #8ca2b8;background:#f9fbfd;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;color:var(--ink)}.hotspot-card>span{font-size:12px;font-weight:800;color:var(--muted)}.hotspot-card>strong{font-size:16px;overflow-wrap:anywhere}.hotspot-card>b{font-size:28px;font-variant-numeric:tabular-nums}.hotspot-card>small{color:var(--muted);overflow-wrap:anywhere}.hotspot-card.watch{border-top-color:#d7aa41}.hotspot-card.high{border-top-color:#df8650}.hotspot-card.critical{border-top-color:#c94c59;background:#fff8f9}.leader-lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.leader-lane{border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:14px;min-width:0}.leader-lane-head{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center;margin-bottom:12px}.leader-lane-head>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;align-items:center;min-width:0}.leader-lane-head strong{font-size:17px}.leader-lane-head small{grid-column:1/-1;color:var(--muted)}.leader-lane-head>b{font-size:14px}.leader-groups{display:grid;gap:8px}.leader-group{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}.leader-group[open]{box-shadow:0 4px 14px #1523340c}.leader-group>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;text-align:center}.leader-group>summary::-webkit-details-marker{display:none}.leader-group>summary>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}.leader-group>summary b{overflow-wrap:anywhere}.leader-group>summary small{font-size:12px;color:var(--muted)}.risk-score{border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#edf1f5;white-space:nowrap}.risk-score.watch{background:#fff4d7;color:#785500}.risk-score.high{background:#fff0e8;color:#924917}.risk-score.critical{background:#fde8ec;color:#9d263d}.leader-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 12px 12px}.leader-stats span{background:#f4f7fa;border-radius:7px;padding:8px;text-align:center;font-size:11px;color:var(--muted);min-width:0}.leader-stats b{display:block;font-size:15px;color:var(--ink);overflow-wrap:anywhere}.leader-advice{text-align:center;margin:0 12px 12px;padding:9px;border-radius:7px;background:#eef5ff;color:#244f7c;font-size:13px}.leader-manager-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:0 12px 12px}.leader-manager-grid>div{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px;text-align:center;min-width:0}.leader-manager-grid span{display:block;white-space:pre-line;overflow-wrap:anywhere;font-size:12px}.leader-manager-grid b{display:block;font-size:13px;margin-top:4px}.leader-more{display:block;text-align:center;color:var(--muted);padding:0 12px 10px}.leader-open{display:flex;justify-content:center;padding:0 12px 12px}.work-top-button{position:fixed;right:18px;bottom:18px;z-index:90;width:46px;height:46px;border-radius:50%;border:1px solid #6c8095;background:#17375e;color:#fff;font-size:22px;box-shadow:0 8px 22px #10263b33;opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s}.work-top-button.visible{opacity:1;pointer-events:auto;transform:none}.density-compact .work-panel{padding:14px;margin:12px 0}.density-compact .destination-card,.density-compact .parcel-row,.density-compact .work-bag{padding:11px}.density-compact .work-kpi{padding:12px;min-height:118px}.density-compact .work-kpi strong{font-size:30px}.density-compact .leader-group>summary{padding:9px}.density-compact .page-time-filter{padding:10px}.density-compact .page-time-grid label{min-height:44px;padding:5px}
@media(max-width:1100px){.page-time-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.leader-lanes{grid-template-columns:1fr}.smart-hotspots{grid-template-columns:repeat(3,minmax(0,1fr))}.active-filter-ribbon{grid-template-columns:1fr;text-align:center}.density-toggle{justify-self:center}.leader-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.app-shell{overflow-x:hidden}.work-health>div{display:flex!important;flex-direction:column!important;align-items:center!important}.work-health strong{text-align:center!important}.work-health small{grid-column:auto!important;text-align:center}.work-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.parcel-row{grid-template-columns:1fr!important}.open-detail{grid-column:auto!important}.global-time-grid,.page-time-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.page-time-filter{padding:12px}.page-time-presets{width:100%}.page-time-presets .work-button{flex:1 1 28%;padding:7px 6px}.smart-hotspots{grid-template-columns:1fr}.leader-lane{padding:10px}.leader-group>summary{grid-template-columns:1fr}.risk-score{justify-self:center}.leader-manager-grid{grid-template-columns:1fr}.leader-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.active-filter-ribbon{padding:10px}.filter-result strong{font-size:22px}.work-section-head,.work-actions-line{align-items:center}.work-actions{justify-content:center}.work-actions>*{flex:1 1 130px}.heat-scroll{overflow:visible;border:0}.heat-table{display:block;min-width:0!important;width:100%}.heat-table thead{display:none}.heat-table tbody,.heat-table tr{display:block;width:100%}.heat-table tr{border:1px solid var(--line);border-radius:10px;background:#fff;margin:0 0 10px;padding:10px}.heat-table th:first-child{display:block;min-width:0!important;padding:8px;background:#eef3f8;border-radius:7px;margin-bottom:6px}.heat-table td{display:grid;grid-template-columns:74px minmax(0,1fr);align-items:center;gap:8px;padding:4px}.heat-table td::before{content:attr(data-label);font-size:12px;font-weight:700;color:var(--muted);text-align:center}.heat-table td .work-button{min-height:36px}.work-top-button{right:12px;bottom:12px}.destination-card footer{flex-direction:column;align-items:center}.weight-totals>div{flex-direction:column!important;justify-content:center!important;text-align:center!important}.app-nav-inner{gap:4px}.app-nav-btn{overflow-wrap:anywhere}}
@media(max-width:420px){.work-kpis{grid-template-columns:1fr}.global-time-grid,.page-time-grid{grid-template-columns:1fr 1fr}.app-nav-inner{grid-template-columns:repeat(2,minmax(0,1fr))!important}.page-time-presets .work-button{flex:1 1 44%}.leader-stats{grid-template-columns:1fr 1fr}}
'''
          if 'Smart Leader v23' in css: raise SystemExit('Smart Leader v23 CSS already present')
          write('ops.css',css+smart_css)

          # Cache-bust all root frontend references without touching backend architecture.
          for path in list(Path('.').glob('*.js'))+[Path('index.html')]:
              s=path.read_text(encoding='utf-8')
              s=s.replace('20260906-manager-multi-v22','20260906-smart-leader-v23')
              path.write_text(s,encoding='utf-8')

          readme=read('README.md')
          section='''\n\n## Smart Leader v23 — 20 client-side upgrades (no extra quota)\n1. จัดกึ่งกลาง KPI / การ์ด / ตาราง / สรุปหลัก\n2. ป้องกันข้อความและปุ่มทับซ้อนด้วย responsive min-width/wrap guards\n3. พัสดุบนมือถือเปลี่ยนเป็น 1 คอลัมน์เมื่อพื้นที่แคบ\n4. Heatmap บนมือถือแปลงเป็นการ์ด ไม่บังคับเลื่อนซ้ายขวา\n5. ทุกหน้ามีตัวเลือกช่วงเวลาเดียวกับ Dashboard\n6. มี preset เวลา ทั้งหมด / <24 / 24–48 / >48 / >=24 / ไม่ทราบ\n7. จำนวนแต่ละช่วงเวลาซิงก์กันทุกหน้า\n8. Active filter chips บอกว่ากำลังกรองอะไร\n9. แตะ chip เพื่อล้างตัวกรองมิตินั้นได้ทันที\n10. Result ribbon บอกยอดหลังกรองชัดเจน\n11. Leader / Hierarchy View แยก LH HUB และ FD สาขา\n12. HUB ใคร HUB มัน / สาขาใครสาขามัน ไม่ปนกัน\n13. ผู้จัดการถูกจัดอยู่ใต้ปลายทางของตัวเอง\n14. Risk Score 0–100 ต่อปลายทาง คำนวณใน browser\n15. Risk badge ปกติ / เฝ้าระวัง / เสี่ยงสูง / วิกฤต\n16. Top 3 Hotspots อัตโนมัติจากข้อมูลที่โหลดแล้ว\n17. ระบบแนะนำ Next Action ตาม >48ชม. / เลยเวลาแผน / ไม่มีแบ็ก\n18. แสดงสัดส่วน % ของแต่ละปลายทางต่อชุดที่กรอง\n19. Leader View เรียงได้ตามความเสี่ยง / จำนวน / น้ำหนัก และคัดลอก Leader Report ได้\n20. สลับมุมมองกระชับ/สบายด้วย localStorage โดยไม่เรียก API เพิ่ม\n\nโบนัส: ปุ่มกลับด้านบนแบบลอย และ mobile no-overlap hardening เพิ่มเติม ทั้งหมดใช้ analytics/snapshot ที่โหลดอยู่แล้ว ไม่มี polling/fetch ใหม่จากฟีเจอร์ชุดนี้\n'''
          if '## Smart Leader v23' not in readme: readme += section
          write('README.md',readme)

          test=read('tests-ui.mjs')
          anchor="emit('ms-full-analytics',a);flush();assert.equal(w.document.querySelectorAll('.work-kpi').length,4);assert.match(w.document.querySelector('#work-dashboard').textContent,/ปลายทางที่ต้องติดตาม/);assert.match(w.document.querySelector('#work-dashboard').textContent,/ผู้จัดการ เอ/);"
          replacement=anchor+"assert.match(w.document.querySelector('#work-dashboard').textContent,/Leader \/ Hierarchy View/);assert.match(w.document.querySelector('#work-dashboard').textContent,/LH HUB/);assert.match(w.document.querySelector('#work-dashboard').textContent,/FD สาขา/);assert.equal(w.document.querySelectorAll('.smart-hotspots .hotspot-card').length,2);assert.ok(w.document.querySelectorAll('.leader-lane').length===2);"
          if anchor not in test: raise SystemExit('tests dashboard anchor missing')
          test=test.replace(anchor,replacement,1)
          test=test.replace("nav('status');assert.equal(w.document.querySelectorAll('.work-charts .work-panel').length,3);","nav('status');assert.equal(w.document.querySelectorAll('.work-charts .work-panel').length,3);assert.ok(w.document.querySelector('#work-status .page-time-filter'));assert.equal(w.document.querySelectorAll('#work-status [data-view-band]').length,10);")
          test=test.replace("nav('weight');assert.match(w.document.querySelector('#work-weight').textContent,/เฉลี่ย/);","nav('weight');assert.match(w.document.querySelector('#work-weight').textContent,/เฉลี่ย/);assert.ok(w.document.querySelector('#work-weight .page-time-filter'));")
          test=test.replace("nav('parcels');await new Promise(r=>setTimeout(r,0));flush();assert.equal(w.document.querySelectorAll('.parcel-row').length,2);","nav('parcels');await new Promise(r=>setTimeout(r,0));flush();assert.ok(w.document.querySelector('#work-parcels .page-time-filter'));assert.equal(w.document.querySelectorAll('.parcel-row').length,2);")
          test=test.replace("nav('bagging');await new Promise(r=>setTimeout(r,0));flush();assert.match(w.document.querySelector('#work-bagging').textContent,/ปลายทางปน/);","nav('bagging');await new Promise(r=>setTimeout(r,0));flush();assert.ok(w.document.querySelector('#work-bagging .page-time-filter'));assert.match(w.document.querySelector('#work-bagging').textContent,/ปลายทางปน/);")
          test=test.replace("nav('backlog');await new Promise(r=>setTimeout(r,0));w.document.querySelector('[data-work-risk=\"over48\"]').click();flush();","nav('backlog');await new Promise(r=>setTimeout(r,0));assert.ok(w.document.querySelector('#work-backlog .page-time-filter'));w.document.querySelector('[data-work-risk=\"over48\"]').click();flush();")
          tail="assert.match(readFileSync('app.js','utf8'),/nav-users-btn/);console.log('PASS: six views, live fallback, latest-action waiting age, expanded Status, persistent checkbox multi-select exact manager dropdown, copy tables, admin nav, mixed bag, details and logout clearing');"
          tail_new="await vm.runInContext(\"copyTable('leaders')\",dom.getInternalVMContext());assert.match(clipboard,/Leader \\/ Hierarchy Report/);const densityButton=w.document.querySelector('[data-density-toggle]');densityButton?.click();flush();assert.equal(w.document.body.classList.contains('density-compact'),true);assert.match(readFileSync('app.js','utf8'),/nav-users-btn/);console.log('PASS: six views, synchronized time filters, Smart Leader hierarchy, risk hotspots, client-only density mode, live fallback, exact manager multiselect, copy tables, mixed bag and details');"
          if tail not in test: raise SystemExit('tests tail anchor missing')
          test=test.replace(tail,tail_new,1)
          write('tests-ui.mjs',test)
          PY

      - name: Validate quota guard and frontend syntax
        shell: bash
        run: |
          node --check app.js
          node --check inspector.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check ops.js
          node --check shell.js
          node --check data-model.js
          node --check auth-client.js
          node --check dropdowns.js
          node tests-data.mjs
          if git diff -- '*.js' | grep -E '^\+.*fetch\s*\('; then
            echo 'Smart Leader v23 must not add fetch/API calls' >&2
            exit 1
          fi

      - name: Validate responsive Smart Leader UI
        shell: bash
        run: |
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs
          grep -q 'Smart Leader v23' ops.css
          grep -q 'data-view-band' ops.js
          grep -q 'Leader / Hierarchy View' ops.js
          grep -q 'heat-table td::before' ops.css
          grep -q 'parcel-row{grid-template-columns:1fr!important}' ops.css

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate existing Edge unchanged
        run: deno check supabase/functions/ms-parcel-api/index.ts

      - name: Commit validated Smart Leader v23
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops.js ops.css index.html app.js inspector.js analytics-client.js snapshot-client.js shell.js data-model.js auth-client.js dropdowns.js README.md tests-ui.mjs
          git commit -m 'feat: smart leader responsive ops v23'
          git push
