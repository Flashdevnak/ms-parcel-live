name: One-shot Handoff Terminology v24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-handoff-language-v24.yml'
      - '.github/scripts/handoff-language-v24.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v24 patch
        run: python .github/scripts/handoff-language-v24.py

      - name: Validate frontend and interactions
        run: |
          node --check app.js
          node --check ops.js
          node --check dropdowns.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check data-model.js
          node tests-data.mjs
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Edge unchanged
        run: deno check supabase/functions/ms-parcel-api/index.ts

      - name: Commit validated v24
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js ops.js analytics-client.js snapshot-client.js dropdowns.js tests-ui.mjs README.md
          git commit -m 'fix: align handoff ownership and operational wording v24'
          git push
