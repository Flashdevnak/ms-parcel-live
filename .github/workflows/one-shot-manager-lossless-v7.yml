name: One-shot lossless manager v7 finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-manager-lossless-v7.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve every manager source column
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('supabase/functions/ms-parcel-api/analytics.ts')
          s=p.read_text(encoding='utf-8')
          old="""function snapshotRow(r:any){return[\n  r?.pno??'',r?.state_name??'',r?.store_weight??'',r?.plan_leave_time??'',r?.real_arrive_time??'',r?.pack_num??'',\n  r?.LastAction_name??'',r?.LastActionTime??'',r?.staff_info_phone??'',r?.store_manager_display??r?.store_manager_phone??'',r?.dst_hub_name??'',r?.dst_store_name??''\n];}"""
          new="""function snapshotRow(r:any){return[\n  r?.pno??'',r?.state_name??'',r?.store_weight??'',r?.plan_leave_time??'',r?.real_arrive_time??'',r?.pack_num??'',\n  r?.LastAction_name??'',r?.LastActionTime??'',r?.staff_info_phone??'',r?.store_manager_display??'',\n  r?.store_id??'',r?.store_name??'',r?.store_manager_name??'',r?.store_manager_phone??'',r?.dst_hub_name??'',r?.dst_store_name??''\n];}"""
          if old not in s: raise SystemExit('snapshotRow pattern not found')
          p.write_text(s.replace(old,new).replace('schemaVersion:6','schemaVersion:7'),encoding='utf-8')

          p=Path('supabase/functions/ms-parcel-api/index.ts')
          s=p.read_text(encoding='utf-8')
          if 'schemaVersion===6' not in s: raise SystemExit('edge schema guard missing')
          p.write_text(s.replace('schemaVersion===6','schemaVersion===7'),encoding='utf-8')

          p=Path('analytics-client.js')
          s=p.read_text(encoding='utf-8')
          if 'schemaVersion===6' not in s: raise SystemExit('client schema guard missing')
          p.write_text(s.replace('schemaVersion===6','schemaVersion===7'),encoding='utf-8')

          p=Path('snapshot-client.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import {snapshotValid} from './data-model.js?v=20260906-total-hint-v1';","import {snapshotValid,decodeSnapshotRow} from './data-model.js?v=20260906-total-hint-v1';")
          start=s.index('function decode(r){')
          end=s.index('\nfunction reset(){',start)
          s=s[:start]+'const decode=decodeSnapshotRow;'+s[end:]
          p.write_text(s,encoding='utf-8')

          p=Path('ops.js')
          s=p.read_text(encoding='utf-8')
          old="import {BANDS,LABELS,clean,time,band,route,hasBag,validAnalytics,match,rowMatch,metrics,groups,bags,riskMatch} from './data-model.js?v=20260906-total-hint-v1';"
          new="import {BANDS,LABELS,clean,time,band,route,hasBag,validAnalytics,match,rowMatch,metrics,groups,bags,riskMatch,managerValue} from './data-model.js?v=20260906-total-hint-v1';"
          if old not in s: raise SystemExit('ops import pattern missing')
          s=s.replace(old,new)
          s=s.replace("esc(r.store_manager_phone||'ไม่ระบุ')","esc(managerValue(r))")
          s=s.replace("['ผู้จัดการสาขา',r.store_manager_phone]","['ผู้จัดการสาขา',managerValue(r)]")
          p.write_text(s,encoding='utf-8')

          p=Path('tests-ui.mjs')
          s=p.read_text(encoding='utf-8')
          if 'schemaVersion:6' not in s: raise SystemExit('UI schema fixture missing')
          s=s.replace('schemaVersion:6','schemaVersion:7')
          s=s.replace("store_manager_display:M1,store_manager_phone:M1,staff_info_phone:'099'","store_manager_display:M1,store_id:'TH00000001',store_name:'01 TEST_HUB-A',store_manager_name:'นาย ผู้จัดการ เอ',store_manager_phone:'0811111111',staff_info_phone:'099'")
          s=s.replace("store_manager_display:M2,store_manager_phone:M2,real_arrive_time","store_manager_display:M2,store_id:'TH00000002',store_name:'02 TEST_HUB-B',store_manager_name:'นางสาว ผู้จัดการ บี',store_manager_phone:'0822222222',real_arrive_time")
          p.write_text(s,encoding='utf-8')

          p=Path('tests-data.mjs')
          s=p.read_text(encoding='utf-8')
          old="import {band,route,validAnalytics,rowMatch,managerValue,bags,snapshotValid} from './data-model.js';"
          new="import {band,route,validAnalytics,rowMatch,managerValue,bags,snapshotValid,decodeSnapshotRow} from './data-model.js';"
          if old not in s: raise SystemExit('tests-data import missing')
          s=s.replace(old,new)
          marker="const fullManager='(TH00000001)01 TEST_HUB-ทดสอบ · นาย ทดสอบ ระบบ · 0812345678';"
          insert=marker+"\nconst decodedManager=decodeSnapshotRow(['PX','คงคลัง',1000,'','','','','','099',fullManager,'TH00000001','01 TEST_HUB-ทดสอบ','นาย ทดสอบ ระบบ','0812345678','NE1_HUB','ปลายทาง']);\nassert.equal(decodedManager.store_id,'TH00000001');assert.equal(decodedManager.store_name,'01 TEST_HUB-ทดสอบ');assert.equal(decodedManager.store_manager_name,'นาย ทดสอบ ระบบ');assert.equal(decodedManager.store_manager_phone,'0812345678');assert.equal(managerValue(decodedManager),fullManager);"
          if marker not in s: raise SystemExit('tests-data manager marker missing')
          p.write_text(s.replace(marker,insert),encoding='utf-8')

          oldver='20260906-total-hint-v1'
          newver='20260906-manager-lossless-v1'
          for name in ['index.html','app.js','ops.js','analytics-client.js','snapshot-client.js']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if oldver in s: p.write_text(s.replace(oldver,newver),encoding='utf-8')
          PY
      - name: Validate frontend and data model
        run: |
          node --check app.js
          node --check inspector.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check ops.js
          node --check shell.js
          node --check data-model.js
          node --check auth-client.js
          node tests-data.mjs
      - name: Validate all six workspace views
        run: |
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge
        run: deno check supabase/functions/ms-parcel-api/index.ts
      - name: Commit validated lossless manager source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/ms-parcel-api/analytics.ts supabase/functions/ms-parcel-api/index.ts analytics-client.js snapshot-client.js ops.js tests-ui.mjs tests-data.mjs index.html app.js
          git commit -m 'fix: preserve full manager columns through snapshot views'
          git push
