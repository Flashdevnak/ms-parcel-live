name: One-shot dropdown full-label v21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-dropdown-full-label-v21.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Link dropdown full-label CSS and bump assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('20260906-operational-v20','20260906-operational-v21')
          anchor='  <link rel="stylesheet" href="ops.css?v=20260906-operational-v21" />\n'
          extra='  <link rel="stylesheet" href="dropdown-fix.css?v=20260906-operational-v21" />\n'
          if extra not in s:
              s=s.replace(anchor,anchor+extra)
          p.write_text(s,encoding='utf-8')
          for name in ['app.js','ops.js','analytics-client.js','snapshot-client.js']:
              q=Path(name)
              t=q.read_text(encoding='utf-8').replace('20260906-operational-v20','20260906-operational-v21')
              q.write_text(t,encoding='utf-8')
          PY
      - name: Validate frontend and data
        run: |
          node --check app.js
          node --check inspector.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check ops.js
          node --check shell.js
          node --check data-model.js
          node --check auth-client.js
          node --check dropdowns.js
          node tests-data.mjs
      - name: Validate six views
        run: |
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge
        run: deno check supabase/functions/ms-parcel-api/index.ts
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js ops.js analytics-client.js snapshot-client.js dropdown-fix.css
          git commit -m 'fix: show full dropdown labels and activate operational v21 assets'
          git push
