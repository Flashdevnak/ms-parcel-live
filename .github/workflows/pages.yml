name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: |
          node --check app.js
          node --check inspector.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check ops.js
          node --check shell.js
          node --check data-model.js
          node --check auth-client.js
          node --check dropdowns.js
          node tests-data.mjs
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge TypeScript
        run: deno check supabase/functions/ms-parcel-api/index.ts
      - name: Verify workspace interactions
        run: |
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
