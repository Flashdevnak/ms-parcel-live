name: One-shot Device HAR UI v25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-device-har-ui-v25.yml'
      - '.github/scripts/device-har-ui-v25.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v25 UI and HAR status patch
        run: python .github/scripts/device-har-ui-v25.py

      - name: Validate frontend and interactions
        run: |
          node --check app.js
          node --check ops.js
          node --check dropdowns.js
          node --check analytics-client.js
          node --check snapshot-client.js
          node --check data-model.js
          node tests-data.mjs
          npm install --prefix /tmp/ms-parcel-ui-test --no-package-lock --no-save jsdom@26.1.0
          NODE_PATH=/tmp/ms-parcel-ui-test/node_modules node tests-ui.mjs
          grep -q "HAR ต้องอัปเดต" app.js
          grep -q "account-badge" index.html
          grep -q "shownBands=BANDS.filter" ops.js
          grep -q "color:#10263b!important" dropdown-fix.css

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Edge unchanged
        run: deno check supabase/functions/ms-parcel-api/index.ts

      - name: Commit validated v25
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js ops.js dropdown-fix.css ops.css analytics-client.js snapshot-client.js dropdowns.js tests-ui.mjs README.md
          git commit -m 'fix: clarify device connection and HAR health v25'
          git push
