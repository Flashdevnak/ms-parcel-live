name: One-shot production v8 data gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-prod-diag-v8.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger one-shot production full snapshot
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 180 \
            'https://afhnfnfbqdqqzrghovfc.supabase.co/functions/v1/ms-parcel-api/diag-7dffd6e7585e4375f2946a71fb679829' \
            | tee /tmp/ms-parcel-prod-diag.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ms-parcel-prod-diag.json',encoding='utf-8'))
          if not d.get('ok'):
              raise SystemExit(d)
          x=d.get('data') or {}
          print(json.dumps(x,ensure_ascii=False,indent=2))
          if x.get('schemaVersion') != 8:
              raise SystemExit('schemaVersion != 8')
          PY
